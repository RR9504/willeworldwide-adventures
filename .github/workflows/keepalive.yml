# Håller mejl/SMS-projektet på Supabase vaket.
#
# send-message och ai-summary ligger på ett eget Supabase-projekt
# (seprpsyzqmppsnmzptyo, konto robin.ruuska@live.se) på gratisplanen, som pausar
# projekt efter ~7 dagars inaktivitet. Mejlutskick är gles trafik — går det en vecka
# mellan anmälningarna somnar projektet, och då slutar ALLA mejl och SMS att gå fram
# utan att någon märker det (anmälningsmejlen skickas fire-and-forget).
#
# Jobbet failar med flit om projektet inte svarar, så GitHub mejlar dig i stället för
# att felet upptäcks av en kund som aldrig fick sin bokningsbekräftelse.
#
# OBS: GitHub stänger av schemalagda workflows i repon utan aktivitet på 60 dagar.
# Kör "Run workflow" manuellt eller pusha något om det varit tyst länge.

name: Håll Supabase vaket

on:
  schedule:
    # Dagligen 06:17 UTC. Schemalagda körningar kan bli försenade vid hög last hos
    # GitHub, så vi kör varje dag i stället för varannan — marginalen till 7 dagar
    # ska tåla att någon körning hoppas över.
    - cron: '17 6 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      PROJECT: https://seprpsyzqmppsnmzptyo.supabase.co
      # Lägg anon-nyckeln för mejl/SMS-projektet i repots secrets som
      # MAIL_PROJECT_ANON_KEY. Utan den hoppas databaspingen över.
      ANON_KEY: ${{ secrets.MAIL_PROJECT_ANON_KEY }}

    steps:
      - name: Ping edge function (send-message)
        run: |
          # OPTIONS är CORS-preflighten — den svarar "ok" utan att skicka något mejl.
          code=$(curl -s -o /dev/null -w '%{http_code}' -m 30 -X OPTIONS \
            "$PROJECT/functions/v1/send-message")
          echo "OPTIONS /functions/v1/send-message -> $code"
          if [ "$code" != "200" ]; then
            echo "::error::Mejl/SMS-projektet svarar inte ($code). Troligen pausat — väck det på supabase.com (konto robin.ruuska@live.se)."
            exit 1
          fi

      - name: Ping databasen
        if: env.ANON_KEY != ''
        run: |
          # Edge-anropet ensamt räknas inte säkert som projektaktivitet. En läsning
          # via PostgREST går mot databasen och gör det.
          #
          # Läser tabellen public.keepalive — skapa den med supabase/keepalive.sql.
          # /rest/v1/ (OpenAPI-roten) duger inte: den är service_role-only, och en
          # service_role-nyckel ska inte ligga i GitHub.
          code=$(curl -s -o /dev/null -w '%{http_code}' -m 30 \
            -H "apikey: $ANON_KEY" -H "Authorization: Bearer $ANON_KEY" \
            "$PROJECT/rest/v1/keepalive?select=id&limit=1")
          echo "GET /rest/v1/keepalive -> $code"
          case "$code" in
            200) ;;
            404) echo "::error::Tabellen public.keepalive saknas. Kör supabase/keepalive.sql i SQL-editorn på projektet."; exit 1 ;;
            401) echo "::error::Nyckeln avvisades (401). Kontrollera att MAIL_PROJECT_ANON_KEY är anon-nyckeln för projekt seprpsyzqmppsnmzptyo."; exit 1 ;;
            *)   echo "::error::Databasen svarar inte ($code). Projektet kan vara pausat."; exit 1 ;;
          esac

      - name: Påminn om databaspingen saknas
        if: env.ANON_KEY == ''
        run: |
          echo "::warning::MAIL_PROJECT_ANON_KEY saknas i repots secrets — bara edge-funktionen pingas, vilket inte säkert räknas som projektaktivitet."
